name: Fly Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API (Backend)'
        required: false
        type: boolean
        default: true
      deploy_web:
        description: 'Deploy Web (Frontend)'
        required: false
        type: boolean
        default: true
      run_migrations:
        description: 'Run database migrations'
        required: false
        type: boolean
        default: true
      run_seeds:
        description: 'Run database seeds'
        required: false
        type: boolean
        default: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.deploy_api == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_API_APP: ${{ secrets.FLY_API_APP }}
        run: |
          flyctl deploy --app $FLY_API_APP --config backend/fly.toml --dockerfile backend/Dockerfile --remote-only

      - name: Ensure API machine is running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_API_APP: ${{ secrets.FLY_API_APP }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_APP:-}" ]; then
            echo "FLY_API_APP not set; skipping machine check"
            exit 1
          fi

          flyctl scale count 1 -a "$FLY_API_APP"

          python - <<'PY'
          import json, subprocess, sys, time, os

          app = os.environ["FLY_API_APP"]

          def machines():
            out = subprocess.check_output(["flyctl", "m", "list", "-a", app, "--json"], text=True)
            return json.loads(out)

          for attempt in range(30):
            data = machines()
              started = [m for m in data if m.get("state") == "started"]
              if started:
                print(f"{app}: found {len(started)} started machine(s)")
                sys.exit(0)
            time.sleep(10)

          print(f"{app}: no running healthy machines after timeout")
          sys.exit(1)
          PY

  run-migrations:
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (github.event_name == 'push' || github.event.inputs.run_migrations == 'true')
    needs: deploy-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure DB machine is running (optional)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_DB_APP: ${{ secrets.FLY_DB_APP }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_DB_APP:-}" ]; then
            echo "FLY_DB_APP not provided; skipping DB machine check"
            exit 0
          fi

          flyctl scale count 1 -a "$FLY_DB_APP"

          python - <<'PY'
          import json, subprocess, sys, time, os

          app = os.environ["FLY_DB_APP"]

          def machines():
            out = subprocess.check_output(["flyctl", "m", "list", "-a", app, "--json"], text=True)
            return json.loads(out)

          for attempt in range(30):
            data = machines()
              started = [m for m in data if m.get("state") == "started"]
              if started:
                print(f"{app}: found {len(started)} started machine(s)")
                sys.exit(0)
            time.sleep(10)

          print(f"{app}: no running healthy machines after timeout")
          sys.exit(1)
          PY

      - name: Run migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_API_APP: ${{ secrets.FLY_API_APP }}
        run: |
          flyctl ssh console -a $FLY_API_APP -C "npm run migrate:prod"

  run-seeds:
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped') &&
      github.event.inputs.run_seeds == 'true'
    needs: [deploy-backend, run-migrations]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run seeds
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_API_APP: ${{ secrets.FLY_API_APP }}
        run: |
          flyctl ssh console -a $FLY_API_APP -C "npm run seed:prod"

  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.deploy_web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_WEB_APP: ${{ secrets.FLY_WEB_APP }}
        run: |
          flyctl deploy --app $FLY_WEB_APP --config frontend/fly.toml --dockerfile frontend/Dockerfile --remote-only

      - name: Ensure Web machine is running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_WEB_APP: ${{ secrets.FLY_WEB_APP }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_WEB_APP:-}" ]; then
            echo "FLY_WEB_APP not set; skipping machine check"
            exit 1
          fi

          flyctl scale count 1 -a "$FLY_WEB_APP"

          python - <<'PY'
          import json, subprocess, sys, time, os

          app = os.environ["FLY_WEB_APP"]

          def machines():
            out = subprocess.check_output(["flyctl", "m", "list", "-a", app, "--json"], text=True)
            return json.loads(out)

          for attempt in range(30):
            data = machines()
              started = [m for m in data if m.get("state") == "started"]
              if started:
                print(f"{app}: found {len(started)} started machine(s)")
                sys.exit(0)
            time.sleep(10)

          print(f"{app}: no running healthy machines after timeout")
          sys.exit(1)
          PY
